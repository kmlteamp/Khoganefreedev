<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HZX AI - Chat Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 90vh;
    background: rgba(20, 20, 35, 0.95);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(120, 100, 255, 0.3);
  }
  .chat-header {
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    padding: 20px 25px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 4px 20px rgba(106, 17, 203, 0.4);
  }
  .avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #6a11cb;
  }
  .header-info h1 { font-size: 20px; font-weight: bold; }
  .header-info p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .status-dot {
    width: 10px; height: 10px;
    background: #00ff88;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .chat-body {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb {
    background: rgba(120, 100, 255, 0.5);
    border-radius: 3px;
  }
  .message {
    display: flex;
    gap: 10px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-avatar {
    width: 35px; height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .message.bot .msg-avatar { background: linear-gradient(135deg, #6a11cb, #2575fc); }
  .message.user .msg-avatar { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .msg-content {
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .message.bot .msg-content {
    background: rgba(106, 17, 203, 0.25);
    border: 1px solid rgba(106, 17, 203, 0.5);
    border-top-left-radius: 4px;
  }
  .message.user .msg-content {
    background: rgba(245, 87, 108, 0.25);
    border: 1px solid rgba(245, 87, 108, 0.5);
    border-top-right-radius: 4px;
  }
  .typing {
    display: flex; gap: 5px;
    padding: 12px 18px;
    background: rgba(106, 17, 203, 0.25);
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  .chat-footer {
    padding: 20px;
    background: rgba(15, 12, 41, 0.8);
    border-top: 1px solid rgba(120, 100, 255, 0.2);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .chat-footer input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 30px;
    border: 1px solid rgba(120, 100, 255, 0.4);
    background: rgba(30, 25, 60, 0.8);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
  }
  .chat-footer input:focus {
    border-color: #6a11cb;
    box-shadow: 0 0 15px rgba(106, 17, 203, 0.5);
  }
  .chat-footer input::placeholder { color: #8899aa; }
  .send-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(106, 17, 203, 0.7); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .welcome { text-align: center; padding: 40px 20px; opacity: 0.7; }
  .welcome h2 {
    font-size: 24px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { font-size: 14px; color: #8899aa; }
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 20px;
  }
  .suggestion {
    padding: 8px 16px;
    background: rgba(106, 17, 203, 0.2);
    border: 1px solid rgba(106, 17, 203, 0.5);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
  }
  .suggestion:hover { background: rgba(106, 17, 203, 0.5); transform: translateY(-2px); }
  @media (max-width: 600px) {
    body { padding: 0; }
    .chat-container { height: 100vh; border-radius: 0; max-width: 100%; }
    .message { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">H</div>
    <div class="header-info">
      <h1>HZX AI</h1>
      <p><span class="status-dot"></span>Đang hoạt động</p>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="welcome" id="welcome">
      <h2>👋 Xin chào!</h2>
      <p>Tôi là HZX AI. Hãy hỏi tôi bất cứ điều gì.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="quickSend('Xin chào')">Xin chào</div>
        <div class="suggestion" onclick="quickSend('Bạn là ai?')">Bạn là ai?</div>
        <div class="suggestion" onclick="quickSend('Giải thích về AI')">Giải thích về AI</div>
        <div class="suggestion" onclick="quickSend('Viết code Python hello world')">Code Python</div>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" id="userInput" placeholder="Nhập tin nhắn..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ================= CẤU HÌNH =================
const ACCOUNT_ID = '67b54121c64cc574ac984da1fd117cbf';
const API_KEY = 'cfut_FVXXpO6mvT6ObBUwOYy8riTXlH9mspyOkoCQrirh3d96f215';
const MODEL = '@cf/meta/llama-3-8b-instruct';
const API_URL = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/${MODEL}`;

let conversationHistory = [];

const chatBody = document.getElementById('chatBody');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// ================= GỬI TIN NHẮN =================
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  addMessage(text, 'user');
  userInput.value = '';
  sendBtn.disabled = true;

  conversationHistory.push({ role: 'user', content: text });

  const typingEl = addTyping();

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'Bạn là HZX AI, trợ lý thông minh, trả lời bằng tiếng Việt, ngắn gọn và chính xác.' },
          ...conversationHistory
        ]
      })
    });

    const rawText = await response.text();
    let data;
    try { data = JSON.parse(rawText); } catch(e) { data = null; }

    if (!response.ok) {
      typingEl.remove();
      addMessage(`❌ Lỗi ${response.status}: ${rawText.substring(0, 300)}`, 'bot');
      sendBtn.disabled = false;
      return;
    }

    let botReply = 'Xin lỗi, tôi không thể trả lời lúc này.';
    if (data && data.result && data.result.response) {
      botReply = data.result.response;
    } else if (data && data.response) {
      botReply = data.response;
    } else if (data && data.result && typeof data.result === 'string') {
      botReply = data.result;
    } else if (data && data.errors) {
      botReply = '❌ Lỗi API: ' + JSON.stringify(data.errors);
    }

    typingEl.remove();
    addMessage(botReply, 'bot');
    conversationHistory.push({ role: 'assistant', content: botReply });

    if (conversationHistory.length > 20) {
      conversationHistory = conversationHistory.slice(-20);
    }
  } catch (err) {
    typingEl.remove();
    addMessage('❌ Lỗi kết nối: ' + err.message, 'bot');
  }

  sendBtn.disabled = false;
  userInput.focus();
}

// ================= HIỂN THỊ TIN NHẮN =================
function addMessage(text, sender) {
  const msg = document.createElement('div');
  msg.className = `message ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = sender === 'user' ? '👤' : '🤖';

  const content = document.createElement('div');
  content.className = 'msg-content';
  content.textContent = text;

  msg.appendChild(avatar);
  msg.appendChild(content);
  chatBody.appendChild(msg);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'message bot';
  msg.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="typing"><span></span><span></span><span></span></div>
  `;
  chatBody.appendChild(msg);
  chatBody.scrollTop = chatBody.scrollHeight;
  return msg;
}

function quickSend(text) {
  userInput.value = text;
  sendMessage();
}

userInput.addEventListener('keypress', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

userInput.focus();
</script>
</body>
</html>
